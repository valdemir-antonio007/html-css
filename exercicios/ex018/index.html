<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fontes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: black;
            font-size: 16px;
        }
        h1 {
           font-family: "Work Sans", sans-serif;
           font-size: 3em;
           
        }
        p {
            font-family: "Open Sans", sans-serif;
            font-size: 2em;
 
        }
        
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Et a aliquam sequi eum ea, dicta maxime dolor quo aspernatur maiores laboriosam quaerat, quas suscipit molestiae voluptatem vitae distinctio rerum nisi.</p>
</body>
</html>
