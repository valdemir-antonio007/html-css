<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            background-color: tomato;
            color: white;
            font-size: 2em;
        }
        table {
            border: 3px solid gray;
            border-collapse: collapse;
            width: 700px;
            
        }
        td, th {
            border: 1px solid gray;
        }
        thead th {
            background-color: rgb(131, 102, 102);
            text-align: center;
        }
        .num {
            text-align: right;
        }
    </style>
</head>
<body>

    <main>

        <table>
            <thead>
                <tr>
                    <th>Estado</th>
                    <th>População</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Sao Paulo</td>
                    <td class="num">21.000.000</td>
                </tr>
                <tr>
                    <td>Minas Gerais</td>
                    <td class="num">14.000.000</td>
                </tr>
                <tr>
                    <td>Rio de Janeiro</td>
                    <td class="num">12000000</td>
                </tr>
                
            </tbody>
            <tfoot>
                <tr>
                    <td>Total de Habitantes</td>
                    <td class="num">210000000</td>
                </tr>
            </tfoot>
        </table>

    </main>
    
</body>
</html>
