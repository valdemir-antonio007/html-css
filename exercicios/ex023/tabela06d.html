<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 800px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
        }
        thead {
            background-color: gray;
            color: white;
        }
        td, th {
            padding: 15px;
            border: 1px solid black;
        }
        .media {
            background-color: gray;
            color: white;
            text-align: left;
        }
        col.carea {
            background-color: blueviolet;
        }
        col.cdisc {
            background-color: aqua;
        }
        main {
            overflow-x: auto;
            min-width: 300px;
            max-width: 800px;
        }
    </style>
</head>
<body>

    <main>
        <table>
            <colgroup>
                <col class="carea">
                <col class="cdisc">
                
            </colgroup>
            <thead>
                <tr>
                    <th scope="col" rowspan="2">Area</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Media</th>
                </tr>
                <tr>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                </tr>
                
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4">Exatas</th>
                    <td>Matematica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Fisica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Quimica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr class="media">
                    <th colspan="4">Media de Exatas</th>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th rowspan="2">Humanas</th>
                    <td>Historia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr class="media">
                    <th colspan="4">Media de Humanas</th>
                    <td>0.0</td>
                </tr>
            </tbody>
        </table>
    </main>
    
</body>
</html>
