<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        div:hover > p{
            color: red;
            display: block;
        }
        div > p {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse abaixo</p>

    <div>Passe o mouse aqui
        <p>TExto escondido...</p>
    </div>
    <p>Fin do exemplo</p>

</body>
</html>
