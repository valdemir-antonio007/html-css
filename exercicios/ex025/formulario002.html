<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>

    <form action="" method="post" autocomplete="on">
        <p>
            <label for="iuser">Usuario</label>
            <input placeholder="Nome" required minlength="5" maxlength="15" type="text" name="user" id="iuser" autocomplete="nickname">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input placeholder="Senha minimo 4 caracteres" minlength="4" maxlength="8" type="password" name="senha" id="isenha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        <p>
            <label for="">Data Nascimento:</label><input  type="date" name="nasc" id="nasc">
            <input onclick="mostrarData()" type="button" value="Pegar Data">
        </p>

        <script>
            


            function mostrarData(){
                let txt_nasc = document.getElementById("nasc").value
                let data = formataData(txt_nasc); 
                alert(`A data selecionada é: ${data}`)
            
            }

            function formataData(data){
                let str = data.split("-");
                let data_formatada = str[2]+"-"+str[1]+"-"+str[0]
                return data_formatada;
            }
        </script>


    </form>
    
</body>
</html>
