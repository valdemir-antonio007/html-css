<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
        form {
            width: 500px;
            margin: auto;
        }
    </style>
</head>
<body>
    <form action="" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masc" value="M" checked> 
             <label for="masc">Masculino</label>  <br>
            <input type="radio" name="sexo" id="fem" value="F"> 
            <label for="fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="basq" id="basq" checked>  
            <label for="basq">Basquete</label> <br>

            <input type="checkbox" name="fut" id="fut" checked> 
            <label for="fut">Futebol</label> <br>   

            <input type="checkbox" name="nat" id="nat">
            <label for="nat">Natacao </label>
        </fieldset>
    </form>
</body>
</html>
